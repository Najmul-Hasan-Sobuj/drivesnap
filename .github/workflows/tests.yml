name: Tests and release
on:
    push:
        branches: [main]
    pull_request:
permissions:
    contents: read
jobs:
    security:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
          with:
            fetch-depth: 0
            persist-credentials: false
        - uses: gitleaks/gitleaks-action@v3
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                include:
                    - php: '8.3'
                      testbench: '^10.0'
                      phpunit: '^12.0'
                    - php: '8.5'
                      testbench: '^11.0'
                      phpunit: '^13.0'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
            - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
              with:
                  php-version: ${{ matrix.php }}
                  extensions: sodium, pdo_sqlite
                  coverage: none
            - run: composer require --dev 'orchestra/testbench:${{ matrix.testbench }}' 'phpunit/phpunit:${{ matrix.phpunit }}' --no-interaction --prefer-dist
            - run: composer test
            - run: composer audit --no-interaction
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version: '22'
            - run: npm ci --ignore-scripts
            - run: npm test
            - run: npm audit
    release:
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        needs: [test, security]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
            - name: Tag a tested version and create its release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  version="v$(cat VERSION)"
                  [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
                  if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$version" >/dev/null 2>&1; then
                    echo "Version already tagged."
                    exit 0
                  fi
                  gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$version" -f sha="$GITHUB_SHA"
                  gh release create "$version" --repo "$GITHUB_REPOSITORY" --title "DriveSnap $version" --generate-notes
